name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v2

      - name: Setup Go
        uses: actions/setup-go@v2
        with:
          go-version: '1.17.5'

      - name: Build Linux
        run: |
          mkdir -p dist
          GOOS=linux GOARCH=amd64 go build -ldflags "-X main.Version=${{ github.ref_name }} -s -w" -o dist/ping-x_${{ github.ref_name }}_linux_amd64 .
          cd dist && tar czf ping-x_${{ github.ref_name }}_linux_amd64.tar.gz ping-x_${{ github.ref_name }}_linux_amd64

      - name: Build Windows
        run: |
          GOOS=windows GOARCH=amd64 go build -ldflags "-X main.Version=${{ github.ref_name }} -s -w" -o dist/ping-x_${{ github.ref_name }}_windows_amd64.exe .
          cd dist && zip ping-x_${{ github.ref_name }}_windows_amd64.zip ping-x_${{ github.ref_name }}_windows_amd64.exe

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
